name: Auto-build OpenCode for Termux

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force specific version (e.g., 1.15.7)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new version
        id: check
        shell: bash
        run: |
          LATEST=$(npm view opencode-linux-arm64 version 2>/dev/null)
          FORCE="${{ github.event.inputs.force_version }}"
          if [[ -n "$FORCE" ]]; then
            LATEST="$FORCE"
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          if [[ -n "$FORCE" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Forced build for version: $LATEST"
          elif gh release view "v$LATEST" >/dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Version $LATEST already released. No update needed."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New version: $LATEST (not yet released)"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y -qq dpkg-dev curl
      - name: Download binary from npm
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          mkdir -p artifacts
          npm pack "opencode-linux-arm64@$VERSION" 2>&1
          tar -xzf opencode-linux-arm64-*.tgz 2>&1
          cp package/bin/opencode artifacts/opencode-linux-arm64
          chmod +x artifacts/opencode-linux-arm64
          file artifacts/opencode-linux-arm64
      - name: Wrap with bun-termux-loader
        shell: bash
        run: |
          set -euo pipefail
          # Prebuilt wrapper/shim are vendored in tools/prebuilt/ so the build
          # no longer breaks when the upstream opencode-termux branch is renamed.
          test -f tools/prebuilt/wrapper
          test -f tools/prebuilt/bunfs_shim.so
          chmod +x tools/prebuilt/wrapper
          git clone --depth 1 https://github.com/Hope2333/bun-termux-loader.git 2>&1
          if ! git -C bun-termux-loader cat-file -e a440b9ca01f14f4ad3d514c8522364b018c66ed3^{commit} 2>/dev/null; then
            git -C bun-termux-loader fetch --quiet --depth 1 origin a440b9ca01f14f4ad3d514c8522364b018c66ed3
          fi
          git -C bun-termux-loader checkout --quiet a440b9ca01f14f4ad3d514c8522364b018c66ed3
          cp tools/prebuilt/wrapper bun-termux-loader/wrapper
          cp tools/prebuilt/bunfs_shim.so bun-termux-loader/bunfs_shim.so
          python3 bun-termux-loader/build.py artifacts/opencode-linux-arm64 --wrapper bun-termux-loader/wrapper --shim bun-termux-loader/bunfs_shim.so 2>&1
          cp "artifacts/opencode-linux-arm64-termux" "artifacts/opencode-termux-aarch64"
          file artifacts/opencode-termux-aarch64
      - name: Stage prefix tree
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          PREFIX_DIR="artifacts/staged/prefix"
          mkdir -p "$PREFIX_DIR/lib/opencode/runtime"
          mkdir -p "$PREFIX_DIR/bin"
          install -m 755 artifacts/opencode-termux-aarch64 "$PREFIX_DIR/lib/opencode/runtime/opencode"
          install -m 755 scripts/launcher.sh "$PREFIX_DIR/bin/opencode"
      - name: Build deb package
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          bash scripts/build-deb.sh "$VERSION"
      - name: Build pacman package
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          bash scripts/build-pacman.sh "$VERSION"
      - name: Create Release and Upload
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          RELEASE_TAG="v$VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists, updating..."
          else
            gh release create "$RELEASE_TAG" --title "OpenCode for Termux v$VERSION" --notes "Automated build of OpenCode v$VERSION for Termux (aarch64)." --repo "${{ github.repository }}"
          fi
          for f in artifacts/opencode-termux-aarch64 packaging/deb/opencode_*.deb packaging/pacman/opencode-*.pkg.tar.xz; do
            if [ -f "$f" ]; then
              gh release upload "$RELEASE_TAG" "$f" --clobber --repo "${{ github.repository }}"
            fi
          done